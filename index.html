<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midade Mieh w Mieh - Together We Build More</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area" id="brand-logo-btn">
                <span class="crown-icon">👑</span>
                <h1 class="brand-title">Midade Mieh w Mieh</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="auth-nav-btn" title="Account"><i class="fa-solid fa-user"></i></button>
                <button class="icon-btn" id="search-btn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="icon-btn" id="menu-btn" title="Menu"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- Main View Area -->
        <main id="main-content" class="content-viewport">
            <!-- Rendered by script.js -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-item active" data-target="home">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" data-target="meetings">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Meetings</span>
            </button>
            <button class="nav-item" data-target="pictures">
                <i class="fa-solid fa-image"></i>
                <span>Pictures</span>
            </button>
            <button class="nav-item" data-target="more">
                <i class="fa-solid fa-bars"></i>
                <span>More</span>
            </button>
        </nav>

        <!-- Side Drawer Overlay -->
        <div class="drawer-overlay" id="drawer-overlay">
            <div class="drawer-content">
                <div class="drawer-header">
                    <div class="logo-area" id="drawer-brand-btn">
                        <span class="crown-icon">👑</span>
                        <h1 class="brand-title" style="font-size:16px; color:white;">Midade Mieh w Mieh</h1>
                    </div>
                    <button class="icon-btn close-drawer" id="close-drawer-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <ul class="drawer-menu-list">
                    <li data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></li>
                    <li data-nav="meetings"><i class="fa-solid fa-calendar-days"></i><span>Meetings</span></li>
                    <li data-nav="about"><i class="fa-solid fa-user-group"></i><span>About Us</span></li>
                    <li data-nav="pictures"><i class="fa-solid fa-image"></i><span>Pictures</span></li>
                    <li data-nav="events"><i class="fa-solid fa-calendar-plus"></i><span>Events</span></li>
                    <li data-nav="team"><i class="fa-solid fa-users"></i><span>Our Team</span></li>
                    <li data-nav="contact"><i class="fa-solid fa-envelope"></i><span>Contact</span></li>
                    <li data-nav="auth"><i class="fa-solid fa-user-lock"></i><span>Sign In / Sign Up</span></li>
                </ul>
                <div class="drawer-footer">
                    <div class="footer-tagline">👑 Together We Build More</div>
                    <div class="footer-copy">Midade Mieh w Mieh © 2025</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Supabase Client SDK first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Separate Auth File -->
    <script src="auth.js"></script>
    <!-- Main Script File -->
    <script src="script.js"></script>
</body>
</html>
