<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#fff" name="theme-color"/>
  <meta content="MIDADE Mieh w Mieh &mdash; together for a brighter tomorrow." name="description"/>
  <title>
   MIDADE Mieh w Mieh
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <style>
:root {
    color-scheme:light;
    --blue:#0788e5;
    --blue2:#006bc7;
    --navy:#071c3e;
    --text:#29466b;
    --muted:#5e7692;
    --pale:#eff8fd;
    --line:#d7e8f4;
    --surface:#fff;
    --surface2:#f4faff;
    --shadow:0 18px 45px rgba(14,80,130,.09)
}
:root[data-theme=dark] {
    color-scheme:dark;
    --navy:#e8f3ff;
    --text:#c2d8ed;
    --muted:#9bb1c8;
    --pale:#10273b;
    --line:#29445a;
    --surface:#0b1b2b;
    --surface2:#102438;
    --shadow:0 18px 45px #0003
}
* {
    box-sizing:border-box
}
html {
    scroll-behavior:smooth
}
body {
    margin:0;
    background:var(--surface);
    color:var(--navy);
    font-family:Inter,Arial,sans-serif;
    transition:background .2s,color .2s
}
button,input,select {
    font:inherit
}
button,a {
    -webkit-tap-highlight-color:transparent
}
button {
    cursor:pointer
}
.hidden {
    display:none!important
}
.wrap {
    width:min(1200px,calc(100% - 44px));
    margin:auto
}
.header {
    height:88px;
    position:sticky;
    top:0;
    z-index:30;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line)
}
.nav {
    height:100%;
    display:flex;
    align-items:center;
    gap:24px
}
.brand {
    display:flex;
    align-items:center;
    text-decoration:none;
    margin-right:auto
}
.brand img {
    width:110px;
    height:70px;
    object-fit:contain
}
.navlinks {
    display:flex;
    align-items:center;
    gap:clamp(10px,1.55vw,22px);
    flex-wrap:wrap
}
.navlinks a {
    font-size:11px;
    font-weight:750;
    letter-spacing:.15px;
    color:var(--navy);
    text-decoration:none;
    white-space:nowrap;
    position:relative;
    padding:12px 0
}
.navlinks a:hover,.navlinks a.active {
    color:var(--blue2)
}
.navlinks a.active:after {
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    border-radius:3px;
    background:var(--blue)
}
.actions {
    display:flex;
    align-items:center;
    gap:9px;
    margin-left:auto
}
.pill {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:999px;
    padding:11px 19px;
    font-size:12px;
    font-weight:800;
    text-decoration:none;
    border:1.5px solid var(--blue);
    transition:transform .2s,background .2s
}
.pill:hover {
    transform:translateY(-1px)
}
.signin {
    background:var(--blue);
    color:#fff;
    border-color:var(--blue)
}
.profile {
    background:var(--pale);
    color:var(--blue2);
    min-width:40px
}
.menu {
    display:none;
    width:40px;
    height:40px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--surface);
    color:var(--navy);
    font-size:21px
}
.hero {
    position:relative;
    overflow:hidden;
    min-height:470px;
    padding:48px 0 55px;
    background:radial-gradient(ellipse at 75% 44%,#eaf8ff 0,transparent 42%),var(--surface)
}
.hero:before {
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    right:-230px;
    bottom:-150px;
    border:1px solid #bde6fb;
    border-radius:50%;
    box-shadow:0 0 0 22px #eaf8ff,0 0 0 44px #f5fbff
}
.hero-inner {
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:20px;
    position:relative;
    z-index:2
}
.hero-copy {
    position:relative;
    z-index:2
}
.eyebrow,.kicker {
    font-size:12px;
    line-height:1.5;
    letter-spacing:1.5px;
    font-weight:850;
    text-transform:uppercase;
    color:#18a9ed
}
.hero h1 {
    font-size:clamp(39px,4.5vw,63px);
    line-height:.99;
    letter-spacing:-2px;
    margin:14px 0 18px;
    font-weight:900
}
.hero h1 span {
    display:block;
    color:var(--blue2)
}
.hero p {
    max-width:490px;
    font-size:15px;
    line-height:1.7;
    color:var(--text);
    margin:0
}
.hero p strong {
    color:var(--blue2)
}
.hero-buttons {
    display:flex;
    gap:11px;
    flex-wrap:wrap;
    margin-top:25px
}
.primary,.secondary {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    padding:13px 21px;
    font-size:12px;
    font-weight:850;
    text-decoration:none
}
.primary {
    background:var(--blue2);
    color:white;
    border:1px solid var(--blue2)
}
.secondary {
    background:var(--surface);
    color:var(--blue2);
    border:1px solid var(--line)
}
.hero-art {
    position:relative;
    z-index:1;
    display:flex;
    justify-content:center;
    align-items:center
}
.hero-art img {
    width:min(100%,550px);
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 10px 14px #0068b40c)
}
.values {
    background:var(--surface2);
    border-block:1px solid var(--line)
}
.value-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:23px 0
}
.value {
    position:relative;
    text-align:center;
    padding:0 20px
}
.value+.value:before {
    content:"";
    position:absolute;
    left:0;
    top:14px;
    bottom:7px;
    width:1px;
    background:var(--line)
}
.value-icon {
    width:42px;
    height:42px;
    margin:0 auto 8px;
    color:var(--blue2)
}
.value-icon svg {
    width:100%;
    height:100%;
    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round
}
.value h3 {
    margin:0 0 6px;
    color:var(--blue2);
    font-size:16px
}
.value p {
    margin:0;
    color:var(--text);
    font-size:12px;
    line-height:1.7
}
.page {
    min-height:58vh;
    padding:50px 0 75px
}
.page-head {
    max-width:760px;
    margin:0 auto 32px;
    text-align:center
}
.page-head h1 {
    font-size:clamp(32px,4.8vw,48px);
    letter-spacing:-1.5px;
    margin:9px 0 12px
}
.page-head p {
    color:var(--muted);
    line-height:1.8;
    margin:0
}
.cards {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px
}
.card {
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    background:var(--surface);
    box-shadow:var(--shadow)
}
.card-icon {
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:var(--pale);
    color:var(--blue2);
    font-size:22px;
    margin-bottom:15px
}
.card h3 {
    font-size:17px;
    margin:0 0 8px
}
.card p {
    font-size:13px;
    color:var(--muted);
    line-height:1.75;
    margin:0
}
.feature-panel {
    padding:28px;
    border-radius:20px;
    background:var(--surface2);
    border:1px solid var(--line);
    margin-top:24px
}
.feature-panel h2 {
    margin:0 0 10px
}
.feature-panel p {
    color:var(--muted);
    line-height:1.8
}
.gallery {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px
}
.gallery-item {
    min-height:185px;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    background:var(--surface2);
    border:1px solid var(--line);
    display:flex;
    align-items:end
}
.gallery-item img {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover
}
.gallery-item .caption {
    position:relative;
    z-index:1;
    width:100%;
    padding:15px;
    background:linear-gradient(transparent,#071c3edb);
    color:white;
    font-size:13px;
    font-weight:800
}
.empty-photo {
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:var(--blue2);
    font-size:38px;
    background:linear-gradient(145deg,#eaf8ff,#d7effd)
}
.empty-photo small {
    display:block;
    font-size:11px;
    text-align:center;
    margin-top:6px;
    color:#426487
}
.leader-card {
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    background:var(--surface);
    display:flex;
    gap:18px;
    align-items:center
}
.leader-avatar {
    width:76px;
    height:76px;
    flex:0 0 76px;
    border-radius:18px;
    background:var(--pale);
    display:grid;
    place-items:center;
    color:var(--blue2);
    font-size:28px;
    font-weight:900;
    overflow:hidden
}
.leader-avatar img {
    width:100%;
    height:100%;
    object-fit:cover
}
.leader-card h3 {
    margin:0 0 5px
}
.leader-card p {
    margin:4px 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.6
}
.tag {
    display:inline-block;
    border-radius:999px;
    padding:5px 9px;
    background:var(--pale);
    color:var(--blue2);
    font-size:10px;
    font-weight:850
}
.coming-soon {
    min-height:42vh;
    display:grid;
    place-items:center;
    text-align:center;
    border:1px dashed #9bcfee;
    background:var(--surface2);
    border-radius:22px;
    padding:35px
}
.coming-soon strong {
    display:block;
    font-size:clamp(38px,7vw,76px);
    font-weight:900;
    letter-spacing:-2px;
    color:var(--blue2)
}
.coming-soon p {
    color:var(--muted);
    max-width:460px;
    line-height:1.7
}
.btn {
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    border-radius:10px;
    padding:10px 14px;
    font-weight:750;
    font-size:12px
}
.btn-blue {
    background:var(--blue2);
    color:#fff;
    border-color:var(--blue2)
}
.btn:disabled {
    opacity:.6;
    cursor:wait
}
.settings-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px
}
.setting-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    padding:15px 0;
    border-bottom:1px solid var(--line)
}
.setting-row:last-child {
    border-bottom:0
}
.setting-row label {
    font-size:13px;
    font-weight:750
}
.setting-row p {
    font-size:12px;
    color:var(--muted);
    margin:5px 0 0
}
.setting-row select {
    padding:9px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--surface);
    color:var(--navy)
}
.switch {
    width:44px;
    height:25px;
    border-radius:99px;
    border:0;
    background:#aab9c8;
    padding:3px
}
.switch:after {
    content:"";
    display:block;
    width:19px;
    height:19px;
    border-radius:50%;
    background:white;
    transition:transform .2s
}
.switch[aria-checked=true] {
    background:var(--blue)
}
.switch[aria-checked=true]:after {
    transform:translateX(19px)
}
.upload-box {
    border:1px dashed #8fc9eb;
    background:var(--surface2);
    border-radius:15px;
    padding:18px;
    margin-top:18px
}
.upload-box input {
    max-width:100%;
    font-size:12px
}
.upload-box p {
    font-size:12px;
    line-height:1.7;
    color:var(--muted)
}
.status {
    font-size:12px;
    line-height:1.6;
    margin-top:10px;
    color:var(--muted)
}
.status.error {
    color:#c03950
}
.status.ok {
    color:#14804a
}
.contact {
    background:#07244a;
    color:white;
    border-radius:22px;
    padding:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:22px
}
.contact p {
    color:#c6dff1;
    line-height:1.7;
    font-size:14px;
    max-width:600px
}
.contact a {
    background:white;
    color:var(--blue2);
    white-space:nowrap
}
.footer {
    padding:24px 0;
    color:var(--muted);
    border-top:1px solid var(--line);
    font-size:12px
}
.footer-inner {
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap
}
.backdrop {
    position:fixed;
    inset:0;
    background:#051a35a8;
    z-index:80;
    display:grid;
    place-items:center;
    padding:18px
}
.modal {
    width:min(100%,430px);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:27px;
    position:relative;
    box-shadow:0 25px 80px #00172c44
}
.close {
    position:absolute;
    right:15px;
    top:15px;
    border:0;
    background:var(--surface2);
    border-radius:10px;
    width:34px;
    height:34px;
    font-size:21px;
    color:var(--navy)
}
.modal h2 {
    font-size:25px;
    margin:8px 0
}
.modal-intro {
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 18px
}
.tabs {
    display:flex;
    gap:5px;
    background:var(--surface2);
    border-radius:11px;
    padding:4px;
    margin-bottom:16px
}
.tabs button {
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px;
    background:transparent;
    color:var(--muted);
    font-weight:750
}
.tabs button.active {
    background:var(--surface);
    color:var(--blue2);
    box-shadow:0 2px 8px #0d477014
}
.field {
    display:block;
    margin:12px 0
}
.field span {
    display:block;
    font-size:11px;
    font-weight:750;
    color:var(--muted);
    margin-bottom:6px
}
.field input {
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:var(--surface);
    color:var(--navy)
}
.field input:focus {
    border-color:var(--blue);
    box-shadow:0 0 0 3px #0788e51c
}
.submit,.google {
    width:100%;
    padding:13px;
    border-radius:11px;
    font-weight:800
}
.submit {
    border:0;
    background:var(--blue2);
    color:white;
    margin-top:6px
}
.google {
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    margin-top:10px
}
.message {
    font-size:12px;
    line-height:1.5;
    min-height:18px;
    color:#b52e48;
    margin-top:10px
}
.message.success {
    color:#14804a
}
.profile-menu {
    position:fixed;
    z-index:45;
    right:22px;
    top:76px;
    width:220px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--surface);
    box-shadow:var(--shadow)
}
.profile-email {
    font-size:11px;
    color:var(--muted);
    padding:9px;
    overflow-wrap:anywhere
}
.profile-menu button {
    border:0;
    background:transparent;
    width:100%;
    text-align:left;
    padding:10px;
    border-radius:8px;
    color:var(--navy)
}
.profile-menu button:hover {
    background:var(--surface2)
}
@media(max-width:1100px) {
    .navlinks {
        gap:9px
    }
    .navlinks a {
        font-size:9px
    }
    .nav {
        gap:14px
    }
    .hero {
        min-height:420px
    }
    .value {
        padding:0 12px
    }
}
@media(max-width:760px) {
    .wrap {
        width:min(100% - 30px,600px)
    }
    .header {
        height:74px
    }
    .brand img {
        width:90px;
        height:60px
    }
    .navlinks {
        display:none;
        position:absolute;
        left:14px;
        right:14px;
        top:68px;
        padding:12px;
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:14px;
        box-shadow:var(--shadow);
        flex-direction:column;
        align-items:stretch;
        gap:0
    }
    .navlinks.open {
        display:flex
    }
    .navlinks a {
        padding:12px;
        font-size:12px
    }
    .navlinks a.active:after {
        display:none
    }
    .menu {
        display:block
    }
    .nav {
        gap:9px
    }
    .actions {
        gap:6px
    }
    .pill {
        padding:10px 13px
    }
    .hero {
        padding:35px 0 22px
    }
    .hero-inner {
        grid-template-columns:1fr;
        gap:8px
    }
    .hero h1 {
        font-size:clamp(39px,10vw,53px)
    }
    .hero p {
        font-size:14px
    }
    .hero-art img {
        width:min(100%,390px);
        max-height:275px
    }
    .value-grid {
        grid-template-columns:repeat(2,1fr);
        gap:24px 0
    }
    .value:nth-child(3):before {
        display:none
    }
    .value h3 {
        font-size:14px
    }
    .value p {
        font-size:11px
    }
    .page {
        padding:38px 0 55px
    }
    .cards,.gallery {
        grid-template-columns:repeat(2,1fr)
    }
    .settings-grid {
        grid-template-columns:1fr
    }
    .contact {
        display:block;
        padding:25px
    }
    .contact a {
        margin-top:8px
    }
    .footer-inner {
        display:block
    }
    .footer-inner span {
        display:block;
        margin:5px 0
    }
}
@media(max-width:440px) {
    .brand img {
        width:70px
    }
    .actions .signin {
        padding:9px 11px;
        font-size:11px
    }
    .hero-buttons>* {
        width:100%
    }
    .cards,.gallery {
        grid-template-columns:1fr
    }
    .gallery-item {
        min-height:160px
    }
    .value {
        padding:0 7px
    }
    .leader-card {
        align-items:flex-start
    }
    .leader-avatar {
        width:58px;
        height:58px;
        flex-basis:58px
    }
    .setting-row {
        align-items:flex-start
    }
    .setting-row select {
        max-width:130px
    }
}

/* Page transitions: a short, subtle entrance when navigating between tabs. */
#app > section {
    animation: pageEnter 360ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}
#app > section:nth-child(2) {
    animation-delay: 35ms;
}
@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
    #app > section {
        animation: none;
    }
    *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
 </head>
 <body>
  <header class="header">
   <div class="wrap nav">
    <a aria-label="MIDADE home" class="brand" href="#home">
     <img alt="IMAC MIDADE Mieh w Mieh logo" src="logo.png"/>
    </a>
    <nav aria-label="Main navigation" class="navlinks" id="navlinks">
     <a data-i18n="home" data-page="home" href="#home">
      HOME
     </a>
     <a data-i18n="about" data-page="about" href="#about">
      ABOUT
     </a>
     <a data-i18n="ourWork" data-page="our-work" href="#our-work">
      OUR WORK
     </a>
     <a data-i18n="getInvolved" data-page="get-involved" href="#get-involved">
      GET INVOLVED
     </a>
     <a data-i18n="news" data-page="news" href="#news">
      NEWS
     </a>
     <a data-i18n="memories" data-page="memories" href="#memories">
      MEMORIES
     </a>

function leader(icon,title,group,desc){return `<article class="card"><div class="leader-card" style="border:0;padding:0;box-shadow:none"><div class="leader-avatar">${icon}</div><div><span class="tag">${group}</span><h3 style="margin-top:8px">${title}</h3><p>${desc}</p></div></div></article>`}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function loadLeaders(){const container=document.querySelector("#app .cards");if(!container||location.hash!=="#leaders")return;const {data,error}=await db.from("groups").select("id,name,profiles(display_name,photo_url,bio,role)").order("name");if(error||!data?.length)return;container.innerHTML=data.map(g=>{const l=Array.isArray(g.profiles)?g.profiles.find(x=>x.role==="leader"):null;return `<article class="card"><div class="leader-card" style="border:0;padding:0;box-shadow:none"><div class="leader-avatar">${l?.photo_url?`<img src="${escapeHtml(l.photo_url)}" alt="">`:"✦"}</div><div><span class="tag">${escapeHtml(g.name)}</span><h3 style="margin-top:8px">${escapeHtml(l?.display_name||"Group leader")}</h3><p>${escapeHtml(l?.bio||"Leader profile coming soon.")}</p></div></div></article>`}).join("")}

async function loadMemories(){if(location.hash!=="#memories")return;const gallery=$("memoriesGallery");if(!gallery)return;const {data,error}=await db.from("memories").select("id,title,image_url,group_id,created_at").order("created_at",{ascending:false}).limit(30);if(error||!data?.length)return;gallery.innerHTML=data.map(m=>`<div class="gallery-item"><img src="${escapeHtml(m.image_url)}" alt="${escapeHtml(m.title||"Community memory")}" loading="lazy"><div class="caption">${escapeHtml(m.title||"Community memory")}</div></div>`).join("")}

async function loadUploadTools(){const area=$("memoryUploadArea"),config=$("groupConfigArea");if(!area||!currentUser)return;const {data,error}=await db.from("profiles").select("role,group_id").eq("id",currentUser.id).maybeSingle();if(error||!data||data.role!=="leader"||!data.group_id)return;currentRole="leader";currentGroup=data.group_id;
const {data:group}=await db.from("groups").select("id,name,age_range,description").eq("id",data.group_id).maybeSingle();
if(config&&group)config.innerHTML=`<div class="upload-box" style="margin:20px 0"><h3>Configure your group</h3><p><span class="admin-badge">${escapeHtml(group.name)}</span> · ${escapeHtml(group.age_range||"Age range not set")}</p><form id="leaderGroupForm" class="admin-form"><label>Group description<textarea id="leaderGroupDescription" maxlength="500" placeholder="Describe your group's activities">${escapeHtml(group.description||"")}</textarea></label><button class="btn btn-blue" type="submit">Save group details</button><div id="leaderGroupStatus" class="status" aria-live="polite"></div></form></div>`;
area.innerHTML=`<div class="upload-box"><h3>Upload a group memory</h3><p>Choose a JPG, PNG or WebP image (max 8 MB). The file will be stored in your group's folder.</p><label class="field"><span>Photo title</span><input id="photoTitle" maxlength="100" placeholder="Add a short title"></label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><button id="uploadPhoto" class="btn btn-blue" style="margin-top:12px">Upload photo</button><div id="uploadStatus" class="status"></div></div>`;
$("uploadPhoto").addEventListener("click",uploadPhoto)}
async function saveLeaderGroup(e){e.preventDefault();const status=$("leaderGroupStatus");if(!status)return;status.textContent="Saving…";const {error}=await db.rpc("leader_update_group_description",{new_description:$("leaderGroupDescription").value.trim()});if(error){status.textContent="Could not save group details: "+error.message;status.className="status error";return}status.textContent="Group details saved.";status.className="status ok";await loadLeaders()}

async function uploadPhoto(){const file=$("photoFile").files[0],status=$("uploadStatus"),button=$("uploadPhoto");if(!file){status.textContent="Choose an image first.";status.className="status error";return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>8*1024*1024){status.textContent="Choose a JPG, PNG or WebP image no larger than 8 MB.";status.className="status error";return}button.disabled=true;status.textContent="Uploading…";try{const {data:profile,error:pe}=await db.from("profiles").select("role,group_id").eq("id",currentUser.id).single();if(pe)throw pe;if(profile.role!=="leader"||!profile.group_id)throw new Error("Your account must be assigned the leader role and a group by an administrator.");const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=`${profile.group_id}/${currentUser.id}/${Date.now()}-${safe}`;const {error:upErr}=await db.storage.from("group-memories").upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;const {data:pub}=db.storage.from("group-memories").getPublicUrl(path);const {error:dbErr}=await db.from("memories").insert({title:$("photoTitle").value.trim()||file.name,image_url:pub.publicUrl,group_id:profile.group_id,uploaded_by:currentUser.id,storage_path:path});if(dbErr)throw dbErr;status.textContent="Photo uploaded successfully.";status.className="status ok";await loadMemories()}catch(e){status.textContent=(e.message||"Upload failed.")+" If this mentions a policy or bucket, complete the setup steps in SETUP.md.";status.className="status error"}finally{button.disabled=false}}

async function refreshAccountRole(){
  currentRole="member";currentGroup=null;
  if(!currentUser){$("devNav").classList.add("hidden");return}
  const {data,error}=await db.from("profiles").select("role,group_id").eq("id",currentUser.id).maybeSingle();
  if(error){console.warn("Could not read profile role:",error.message);$("devNav").classList.add("hidden");return}
  currentRole=data?.role||"member";currentGroup=data?.group_id||null;
  $("devNav").classList.toggle("hidden",currentRole!=="dev");
}
function setDevStatus(message,kind=""){const el=$("devStatus");if(!el)return;el.textContent=message;el.className="admin-status"+(kind?" "+kind:"")}
async function loadDevConsole(){
 const gate=$("devGate"),panel=$("devConsole");if(!gate||!panel)return;
 gate.classList.remove("hidden");panel.classList.add("hidden");
 if(!currentUser){gate.innerHTML='<h2>Sign in required</h2><p>You must sign in with your developer account.</p><button class="btn btn-blue" data-open-auth>Sign in</button>';return}
 await refreshAccountRole();
 if(currentRole!=="dev"){gate.innerHTML='<h2>Access denied</h2><p>This account does not have the developer role. Ask the existing developer to grant it in the Supabase database.</p>';return}
 gate.classList.add("hidden");panel.classList.remove("hidden");
 await Promise.all([loadAdminGroups(),loadAdminUsers()]);
}
async function loadAdminGroups(){
 const list=$("groupAdminList");if(!list)return;list.innerHTML='<p class="admin-note">Loading groups…</p>';
 const {data,error}=await db.from("groups").select("id,name,age_range,description").order("name");
 if(error){list.innerHTML='<p class="admin-note">Could not load groups. Run the included SQL setup in Supabase first.</p>';setDevStatus(error.message,"error");return}
 if(!data?.length){list.innerHTML='<p class="admin-note">No groups yet. Add your first group above.</p>';return}
 list.innerHTML=data.map(g=>`<div class="admin-row group-row" data-group-id="${escapeHtml(g.id)}"><div><strong>${escapeHtml(g.name)}</strong><div class="admin-note">${escapeHtml(g.age_range||g.description||"No age range set")}</div></div><div class="admin-actions"><button class="admin-btn" data-rename-group="${escapeHtml(g.id)}">Rename / edit</button><button class="admin-btn danger" data-delete-group="${escapeHtml(g.id)}">Remove</button></div></div>`).join("");
}
async function loadAdminUsers(){
 const list=$("userAdminList");if(!list)return;list.innerHTML='<p class="admin-note">Loading users…</p>';
 const [{data:users,error:ue},{data:groups,error:ge}]=await Promise.all([
  db.from("profiles").select("id,email,display_name,role,group_id").order("display_name"),
  db.from("groups").select("id,name").order("name")
 ]);
 if(ue||ge){list.innerHTML='<p class="admin-note">Could not load users or groups. Check that the SQL setup and RLS policies have been applied.</p>';setDevStatus((ue||ge).message,"error");return}
 if(!users?.length){list.innerHTML='<p class="admin-note">No profiles yet. Ask users to create accounts first.</p>';return}
 const opts=(selected)=>`<option value="">No group</option>`+groups.map(g=>`<option value="${escapeHtml(g.id)}" ${g.id===selected?"selected":""}>${escapeHtml(g.name)}</option>`).join("");
 list.innerHTML=users.map(u=>`<div class="admin-row" data-user-id="${escapeHtml(u.id)}"><div><strong>${escapeHtml(u.display_name||"Unnamed user")}</strong><div class="admin-note">${escapeHtml(u.email||u.id)} ${u.id===currentUser.id?' · you':''}</div></div><select aria-label="Role for ${escapeHtml(u.display_name||u.email||'user')}" data-role-select="${escapeHtml(u.id)}"><option value="member" ${u.role==="member"?"selected":""}>Member</option><option value="leader" ${u.role==="leader"?"selected":""}>Group leader</option><option value="dev" ${u.role==="dev"?"selected":""}>Developer</option></select><select aria-label="Group for ${escapeHtml(u.display_name||u.email||'user')}" data-group-select="${escapeHtml(u.id)}">${opts(u.group_id)}</select><div class="admin-actions"><button class="admin-btn primary" data-save-user="${escapeHtml(u.id)}">Save</button></div></div>`).join("");
}
async function createGroup(e){
 e.preventDefault();const name=$("newGroupName").value.trim(),age=$("newGroupAge").value.trim();if(!name)return;
 const {error}=await db.from("groups").insert({name,age_range:age||null,description:age||null});
 if(error){setDevStatus("Could not add group: "+error.message,"error");return}
 $("groupCreateForm").reset();setDevStatus("Group created.","ok");await loadAdminGroups();await loadAdminUsers();
}
async function renameGroup(id){
 const {data,error}=await db.from("groups").select("name,age_range,description").eq("id",id).single();if(error){setDevStatus(error.message,"error");return}
 const name=prompt("New group name:",data.name);if(name===null)return;if(!name.trim()){setDevStatus("Group name cannot be empty.","error");return}
 const age=prompt("Age range / short description:",data.age_range||data.description||"");if(age===null)return;
 const {error:upErr}=await db.from("groups").update({name:name.trim(),age_range:age.trim()||null,description:age.trim()||null}).eq("id",id);
 if(upErr){setDevStatus("Could not update group: "+upErr.message,"error");return}setDevStatus("Group updated.","ok");await loadAdminGroups();await loadAdminUsers();
}
async function deleteGroup(id){
 const {data:group,error}=await db.from("groups").select("name").eq("id",id).single();if(error){setDevStatus(error.message,"error");return}
 if(!confirm(`Remove “${group.name}”? Users assigned to it will become unassigned. This does not delete their accounts. Continue?`))return;
 const {error:rpcError}=await db.rpc("dev_delete_group",{target_group_id:id});
 if(rpcError){setDevStatus("Could not remove group: "+rpcError.message+" Make sure the SQL setup is installed.","error");return}
 setDevStatus("Group removed and its users unassigned.","ok");await loadAdminGroups();await loadAdminUsers();
}
async function saveAdminUser(id){
 const role=$(`[data-role-select="${CSS.escape(id)}"]`).value;const groupId=$(`[data-group-select="${CSS.escape(id)}"]`).value||null;
 if(role==="leader"&&!groupId){setDevStatus("Choose a group for every group leader.","error");return}
 if(role!=="leader"&&groupId){if(!confirm("This role is not Group leader. Clear the group assignment?"))return}
 const {error}=await db.rpc("dev_set_user_role",{target_user_id:id,new_role:role,target_group_id:role==="leader"?groupId:null});
 if(error){setDevStatus("Could not update user: "+error.message+" Make sure the SQL setup is installed.","error");return}
 setDevStatus("User role and group assignment saved.","ok");await loadAdminUsers();if(id===currentUser.id)await refreshAccountRole();
}

document.addEventListener("submit",e=>{if(e.target.id==="groupCreateForm")createGroup(e);if(e.target.id==="leaderGroupForm")saveLeaderGroup(e)});
document.addEventListener("click",e=>{
 const rename=e.target.closest("[data-rename-group]");if(rename)renameGroup(rename.dataset.renameGroup);
 const del=e.target.closest("[data-delete-group]");if(del)deleteGroup(del.dataset.deleteGroup);
 const save=e.target.closest("[data-save-user]");if(save)saveAdminUser(save.dataset.saveUser);
});

function renderPage(){const page=location.hash.slice(1)||"home";const key=pages[page]?page:"home";$("app").innerHTML=pages[key]();document.querySelectorAll(".navlinks a").forEach(a=>a.classList.toggle("active",a.dataset.page===key));if(key==="settings"){const select=$("languageSelect");if(select)select.value=lang;const sw=$("darkSwitch");if(sw){sw.setAttribute("aria-checked",String(theme==="dark"));sw.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";applyTheme();sw.setAttribute("aria-checked",String(theme==="dark"))})}}if(key==="leaders")loadLeaders();if(key==="memories"){loadMemories();loadUploadTools()}if(key==="dev")loadDevConsole()}

document.addEventListener("click",e=>{const nav=e.target.closest("[data-go]");if(nav){e.preventDefault();go(nav.dataset.go)}const auth=e.target.closest("[data-open-auth]");if(auth)showAuth()});

document.addEventListener("change",e=>{if(e.target.id==="languageSelect"){lang=e.target.value;localStorage.setItem("midade-lang",lang);applyLanguage()}});

$("menuBtn").addEventListener("click",()=>{const open=$("navlinks").classList.toggle("open");$("menuBtn").setAttribute("aria-expanded",String(open));$("menuBtn").textContent=open?"×":"☰"});
document.querySelectorAll(".navlinks a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.page)}));

window.addEventListener("popstate",renderPage);
window.addEventListener("hashchange",()=>{renderPage();window.scrollTo(0,0)});

function showAuth(){ $("authBackdrop").classList.remove("hidden");$("authMessage").textContent="";$("email").focus() }
function hideAuth(){$("authBackdrop").classList.add("hidden")}

$("signinTop").addEventListener("click",showAuth);
$("modalClose").addEventListener("click",hideAuth);
$("authBackdrop").addEventListener("click",e=>{if(e.target===$("authBackdrop"))hideAuth()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideAuth()});

function setMode(mode){authMode=mode;$("loginTab").classList.toggle("active",mode==="login");$("signupTab").classList.toggle("active",mode==="signup");$("nameField").classList.toggle("hidden",mode!=="signup");$("authTitle").textContent=mode==="login"?"Sign in":"Create your account";$("submitAuth").textContent=mode==="login"?"Sign in":"Create account";$("password").autocomplete=mode==="login"?"current-password":"new-password";$("authMessage").textContent=""}

$("loginTab").addEventListener("click",()=>setMode("login"));
$("signupTab").addEventListener("click",()=>setMode("signup"));

async function updateHeader(user){currentUser=user;await refreshAccountRole();$("signinTop").classList.toggle("hidden",!!user);$("profileBtn").classList.toggle("hidden",!user);if(user){$("profileBtn").textContent=(user.user_metadata?.display_name||user.email||"U").trim()[0].toUpperCase();$("profileEmail").textContent=user.email||"Signed in";}else{$("profileMenu").classList.add("hidden");currentRole="member"}}

$("profileBtn").addEventListener("click",()=>$("profileMenu").classList.toggle("hidden"));
$("profileSettings").addEventListener("click",()=>{ $("profileMenu").classList.add("hidden");go("settings")});
document.addEventListener("click",e=>{if(!e.target.closest("#profileBtn")&&!e.target.closest("#profileMenu"))$("profileMenu").classList.add("hidden")});

$("profileSignOut").addEventListener("click",async()=>{const {error}=await db.auth.signOut();if(error){alert(error.message);return}await updateHeader(null);go("home")});

$("authForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("submitAuth");btn.disabled=true;$("authMessage").classList.remove("success");$("authMessage").textContent=authMode==="login"?"Signing in…":"Creating account…";try{let result;const email=$("email").value.trim(),password=$("password").value;if(authMode==="signup"){const displayName=$("displayName").value.trim();if(!displayName)throw new Error("Please enter your name.");result=await db.auth.signUp({email,password,options:{data:{display_name:displayName},emailRedirectTo:location.origin+location.pathname}});if(result.error)throw result.error;if(result.data.session){hideAuth();await updateHeader(result.data.user);go("home")}else{$("authMessage").classList.add("success");$("authMessage").textContent="Account created. Check your email to confirm your address, then sign in."}}else{result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;hideAuth();await updateHeader(result.data.user);go("home")}}catch(err){
  const rawMessage = String(err?.message || "");
  const message = /invalid api key|apikey.*invalid|invalid.*apikey/i.test(rawMessage)
    ? "Supabase rejected the API key. Check that the Project URL and publishable/anon key both come from the same Supabase project (Project Settings → API Keys), then reload the page."
    : /invalid login credentials/i.test(rawMessage)
      ? "Email or password is incorrect. If you just created your account, confirm your email first."
      : /email not confirmed/i.test(rawMessage)
        ? "Please confirm your email using the link sent to your inbox, then sign in."
        : rawMessage || "Unable to complete authentication.";
  $("authMessage").textContent=message;
}finally{btn.disabled=false}});

$("googleBtn").addEventListener("click",async()=>{const status=$("authMessage");status.textContent="Redirecting to Google…";const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:false}});if(error)status.textContent=error.message});

/* OAuth callback: restore the session and clean callback parameters from the URL. */

db.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{await updateHeader(session?.user||null);if(session?.user&&["SIGNED_IN","INITIAL_SESSION","TOKEN_REFRESHED"].includes(event)){if($("authBackdrop")&&!$("authBackdrop").classList.contains("hidden"))hideAuth();if(location.hash.startsWith("#access_token")||location.search.includes("code=")){history.replaceState({},document.title,location.pathname+"#home")}renderPage()}},0)});

(async()=>{applyTheme();$("year").textContent=new Date().getFullYear();const {data,error}=await db.auth.getSession();if(error)console.warn("Session restore:",error.message);await updateHeader(data?.session?.user||null);if(location.search.includes("code=")){history.replaceState({},document.title,location.pathname+(location.hash||"#home"))}renderPage();if(location.hash.startsWith("#access_token"))history.replaceState({},document.title,location.pathname+"#home");if(location.hash.length>1)window.scrollTo(0,0)})();
  </script>
 </body>
