<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10131f" />
  <title>MIDADE Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1020;
      --panel: rgba(22, 28, 48, .88);
      --panel2: #1b2340;
      --line: rgba(255,255,255,.10);
      --text: #f4f6ff;
      --muted: #a4acc4;
      --accent: #8b7cff;
      --accent2: #5bd6c3;
      --danger: #ff7d91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(ellipse at 15% 0%, #292653 0, transparent 42%),
                  radial-gradient(ellipse at 100% 100%, #123b48 0, transparent 38%), var(--bg);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card {
      width: min(100%, 440px); padding: 34px; border: 1px solid var(--line);
      border-radius: 24px; background: var(--panel); box-shadow: 0 24px 80px #0007;
      backdrop-filter: blur(18px);
    }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo {
      width: 44px; height:44px; display:grid; place-items:center; border-radius:14px;
      background: linear-gradient(135deg,var(--accent),var(--accent2)); color:#10131f;
      font-weight:900; font-size:20px;
    }
    h1 { font-size:25px; margin:0 0 6px; letter-spacing:-.7px; }
    .sub { color:var(--muted); margin:0; font-size:14px; }
    .tabs { display:flex; padding:4px; border-radius:12px; background:#0d1222; margin:26px 0 20px; }
    .tabs button { flex:1; border:0; border-radius:9px; padding:10px; color:var(--muted); background:transparent; }
    .tabs button.active { color:var(--text); background:var(--panel2); }
    .field { display:block; margin:14px 0; }
    .field span { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; }
    .field input {
      width:100%; border:1px solid var(--line); border-radius:11px; padding:13px 14px;
      color:var(--text); background:#0d1222; outline:none;
    }
    .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #8b7cff22; }
    .primary, .google {
      width:100%; border:0; border-radius:11px; padding:13px 15px; font-weight:700;
      transition:transform .15s, opacity .15s;
    }
    .primary { color:#10131f; background:linear-gradient(110deg,#a99cff,#62dfce); margin-top:8px; }
    .google { color:var(--text); background:#202943; border:1px solid var(--line); margin-top:12px; }
    button:hover { opacity:.92; } button:active { transform:scale(.99); }
    .divider { display:flex; align-items:center; gap:12px; color:#7f89a6; font-size:11px; margin:18px 0 4px; }
    .divider:before,.divider:after { content:""; height:1px; flex:1; background:var(--line); }
    .message { min-height:20px; color:var(--danger); font-size:13px; margin-top:12px; line-height:1.4; }
    .hint { color:var(--muted); font-size:12px; line-height:1.5; margin:16px 0 0; }
    .hidden { display:none !important; }

    .chat-shell { min-height:100vh; padding:22px; display:grid; place-items:center; }
    .chat {
      width:min(100%, 980px); height:min(850px, calc(100vh - 44px)); min-height:520px;
      display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line);
      border-radius:22px; background:var(--panel); box-shadow:0 24px 80px #0007; backdrop-filter:blur(18px);
    }
    .chat-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:19px 22px; border-bottom:1px solid var(--line); }
    .chat-title { display:flex; align-items:center; gap:12px; min-width:0; }
    .chat-title h1 { font-size:18px; margin:0; }
    .online { font-size:12px; color:var(--accent2); margin-top:4px; }
    .user-area { display:flex; align-items:center; gap:12px; }
    .user-name { color:var(--muted); font-size:12px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .logout { border:1px solid var(--line); border-radius:9px; padding:8px 11px; background:#202943; color:var(--text); font-size:12px; }
    .messages { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:13px; }
    .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; }
    .bubble { max-width:min(75%, 620px); align-self:flex-start; }
    .bubble.mine { align-self:flex-end; }
    .meta { display:flex; gap:8px; align-items:center; margin:0 8px 5px; color:var(--muted); font-size:11px; }
    .bubble.mine .meta { justify-content:flex-end; }
    .content { padding:11px 14px; border-radius:15px 15px 15px 4px; background:#252d4b; line-height:1.45; font-size:14px; overflow-wrap:anywhere; white-space:pre-wrap; }
    .mine .content { color:#10131f; background:linear-gradient(120deg,#b6aaff,#78e5d5); border-radius:15px 15px 4px 15px; }
    .composer { display:flex; gap:10px; padding:16px; border-top:1px solid var(--line); }
    .composer input { flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; padding:13px 15px; color:var(--text); background:#0d1222; outline:none; }
    .composer input:focus { border-color:var(--accent); }
    .send { border:0; border-radius:12px; padding:0 22px; font-weight:800; color:#10131f; background:linear-gradient(110deg,#a99cff,#62dfce); }
    .chat-status { min-height:17px; padding:0 18px 8px; color:var(--muted); font-size:11px; }
    @media(max-width:600px) {
      .shell { padding:14px; } .auth-card { padding:25px 21px; }
      .chat-shell { padding:0; } .chat { width:100%; height:100dvh; min-height:0; border-radius:0; border:0; }
      .chat-head { padding:15px; } .messages { padding:16px 12px; }
      .bubble { max-width:88%; } .user-name { max-width:90px; }
      .composer { padding:12px; } .send { padding:0 16px; }
    }
  </style>
</head>
<body>
  <main id="authView" class="shell">
    <section class="auth-card">
      <div class="brand">
        <div class="logo">M</div>
        <div><h1>MIDADE Chat</h1><p class="sub">A place for everyone to connect.</p></div>
      </div>
      <div class="tabs">
        <button id="loginTab" class="active" type="button">Sign in</button>
        <button id="signupTab" type="button">Create account</button>
      </div>
      <form id="authForm">
        <label id="nameField" class="field hidden"><span>Display name</span><input id="displayName" maxlength="40" autocomplete="name" placeholder="Your name"></label>
        <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label class="field"><span>Password</span><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></label>
        <button id="submitAuth" class="primary" type="submit">Sign in</button>
      </form>
      <div class="divider">OR</div>
      <button id="googleBtn" class="google" type="button">Continue with Google</button>
      <div id="authMessage" class="message" role="status"></div>
      <p class="hint">By continuing, you agree to use the public chat respectfully. Do not share passwords, private contact details, or sensitive personal information.</p>
    </section>
  </main>

  <main id="chatView" class="chat-shell hidden">
    <section class="chat">
      <header class="chat-head">
        <div class="chat-title">
          <div class="logo">M</div>
          <div><h1>Public Chat</h1><div class="online">● Community room</div></div>
        </div>
        <div class="user-area"><span id="currentUser" class="user-name"></span><button id="logoutBtn" class="logout" type="button">Sign out</button></div>
      </header>
      <div id="messages" class="messages"><div class="empty">Loading messages…</div></div>
      <div id="chatStatus" class="chat-status" role="status"></div>
      <form id="messageForm" class="composer">
        <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Write a message…" aria-label="Write a message" required>
        <button id="sendBtn" class="send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    // These are frontend-safe values: Supabase project URL + anon/public key only.
    const SUPABASE_URL = "https://ogopytqswaeljinyvvei.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nb3B5dHFzd2FlbGppbnl2dmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTYxNzksImV4cCI6MjEwNzczMjE3OX0.Q8Fi-YMywUIGnIyZHf5VAdI49BtZ5pSx-5OYdB8R0wQ";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const $ = (id) => document.getElementById(id);
    const authView = $("authView"), chatView = $("chatView");
    let mode = "login";
    let activeUser = null;
    let realtimeChannel = null;
    let renderedIds = new Set();

    function showMessage(text, isChat = false) {
      (isChat ? $("chatStatus") : $("authMessage")).textContent = text || "";
    }
    function setMode(next) {
      mode = next;
      $("loginTab").classList.toggle("active", mode === "login");
      $("signupTab").classList.toggle("active", mode === "signup");
      $("nameField").classList.toggle("hidden", mode !== "signup");
      $("submitAuth").textContent = mode === "login" ? "Sign in" : "Create account";
      $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
      showMessage("");
    }
    $("loginTab").addEventListener("click", () => setMode("login"));
    $("signupTab").addEventListener("click", () => setMode("signup"));

    function displayName(user) {
      return user.user_metadata?.display_name ||
             user.user_metadata?.full_name ||
             user.user_metadata?.name ||
             user.email?.split("@")[0] ||
             "Member";
    }
    function showAuth() {
      authView.classList.remove("hidden");
      chatView.classList.add("hidden");
      activeUser = null;
      if (realtimeChannel) {
        db.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
    }
    async function showChat(user) {
      if (!user) return;
      activeUser = user;
      authView.classList.add("hidden");
      chatView.classList.remove("hidden");
      $("currentUser").textContent = displayName(user);
      await loadMessages();
      subscribeToMessages();
    }

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = $("email").value.trim();
      const password = $("password").value;
      const button = $("submitAuth");
      button.disabled = true;
      showMessage(mode === "login" ? "Signing in…" : "Creating your account…");
      try {
        let result;
        if (mode === "signup") {
          const name = $("displayName").value.trim();
          if (!name) throw new Error("Please enter a display name.");
          result = await db.auth.signUp({
            email, password,
            options: {
              data: { display_name: name },
              emailRedirectTo: window.location.origin
            }
          });
          if (result.error) throw result.error;
          if (result.data.session) {
            await showChat(result.data.user);
          } else {
            showMessage("Account created. Check your email to confirm your account, then sign in.");
          }
        } else {
          result = await db.auth.signInWithPassword({ email, password });
          if (result.error) throw result.error;
          await showChat(result.data.user);
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong.");
      } finally {
        button.disabled = false;
      }
    });

    $("googleBtn").addEventListener("click", async () => {
      showMessage("Redirecting to Google…");
      const { error } = await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin }
      });
      if (error) showMessage(error.message);
    });

    $("logoutBtn").addEventListener("click", async () => {
      $("logoutBtn").disabled = true;
      const { error } = await db.auth.signOut();
      if (error) showMessage(error.message, true);
      else showAuth();
      $("logoutBtn").disabled = false;
    });

    function formatTime(value) {
      return new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }
    function addMessage(row) {
      if (!row || renderedIds.has(row.id)) return;
      renderedIds.add(row.id);
      const container = $("messages");
      const empty = container.querySelector(".empty");
      if (empty) empty.remove();

      const mine = row.user_id === activeUser?.id;
      const bubble = document.createElement("article");
      bubble.className = "bubble" + (mine ? " mine" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("span");
      name.textContent = mine ? "You" : (row.username || "Member");
      const time = document.createElement("time");
      time.textContent = formatTime(row.created_at);
      meta.append(name, time);
      const content = document.createElement("div");
      content.className = "content";
      content.textContent = row.content;
      bubble.append(meta, content);
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    async function loadMessages() {
      renderedIds.clear();
      $("messages").replaceChildren();
      const { data, error } = await db.from("messages")
        .select("id,user_id,username,content,created_at")
        .order("created_at", { ascending: true })
        .limit(200);
      if (error) {
        $("messages").innerHTML = '<div class="empty">Could not load chat. Check your Supabase table and RLS setup.</div>';
        showMessage(error.message, true);
        return;
      }
      if (!data.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No messages yet. Start the conversation!";
        $("messages").appendChild(empty);
      } else {
        data.forEach(addMessage);
      }
    }

    function subscribeToMessages() {
      if (realtimeChannel) db.removeChannel(realtimeChannel);
      realtimeChannel = db.channel("public-chat-messages")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" },
          (payload) => addMessage(payload.new))
        .subscribe((status) => {
          if (status === "SUBSCRIBED") showMessage("Live updates connected.", true);
          if (status === "CHANNEL_ERROR") showMessage("Live updates unavailable. Check Realtime is enabled.", true);
        });
    }

    $("messageForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!activeUser) return;
      const input = $("messageInput");
      const content = input.value.trim();
      if (!content) return;
      $("sendBtn").disabled = true;
      showMessage("");
      const { error } = await db.from("messages").insert({
        user_id: activeUser.id,
        username: displayName(activeUser),
        content
      });
      if (error) showMessage(error.message, true);
      else input.value = "";
      $("sendBtn").disabled = false;
      input.focus();
    });

    // Supabase persists the session in localStorage and restores it on reload.
    db.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        if (activeUser?.id !== session.user.id) {
          setTimeout(() => showChat(session.user), 0);
        }
      } else if (event === "SIGNED_OUT") {
        showAuth();
      }
    });

    (async function start() {
      const { data, error } = await db.auth.getSession();
      if (error) showMessage(error.message);
      if (data.session?.user) await showChat(data.session.user);
      else showAuth();
    })();
  </script>
</body>
</html>
