  <style>
:root {
    color-scheme:light;
    --blue:#0788e5;
    --blue2:#006bc7;
    --navy:#071c3e;
    --text:#29466b;
    --muted:#5e7692;
    --pale:#eff8fd;
    --line:#d7e8f4;
    --surface:#fff;
    --surface2:#f4faff;
    --shadow:0 18px 45px rgba(14,80,130,.09)
}
:root[data-theme=dark] {
    color-scheme:dark;
    --navy:#e8f3ff;
    --text:#c2d8ed;
    --muted:#9bb1c8;
    --pale:#10273b;
    --line:#29445a;
    --surface:#0b1b2b;
    --surface2:#102438;
    --shadow:0 18px 45px #0003
}
* { box-sizing:border-box }
html { scroll-behavior:smooth }
body {
    margin:0;
    background:var(--surface);
    color:var(--navy);
    font-family:Inter,Arial,sans-serif;
    transition:background .2s,color .2s
}
button,input,select,textarea { font:inherit }
button,a { -webkit-tap-highlight-color:transparent }
button { cursor:pointer }
.hidden { display:none!important }
.wrap {
    width:min(1200px,calc(100% - 44px));
    margin:auto
}
.header {
    height:88px;
    position:sticky;
    top:0;
    z-index:30;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line)
}
.nav {
    height:100%;
    display:flex;
    align-items:center;
    gap:24px
}
.brand {
    display:flex;
    align-items:center;
    text-decoration:none;
    margin-right:auto
}
.brand img {
    width:110px;
    height:70px;
    object-fit:contain
}
.navlinks {
    display:flex;
    align-items:center;
    gap:clamp(10px,1.55vw,22px);
    flex-wrap:wrap
}
.navlinks a {
    font-size:11px;
    font-weight:750;
    letter-spacing:.15px;
    color:var(--navy);
    text-decoration:none;
    white-space:nowrap;
    position:relative;
    padding:12px 0
}
.navlinks a:hover,.navlinks a.active { color:var(--blue2) }
.navlinks a.active:after {
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    border-radius:3px;
    background:var(--blue)
}
.actions {
    display:flex;
    align-items:center;
    gap:9px;
    margin-left:auto
}
.pill {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:999px;
    padding:11px 19px;
    font-size:12px;
    font-weight:800;
    text-decoration:none;
    border:1.5px solid var(--blue);
    transition:transform .2s,background .2s
}
.pill:hover { transform:translateY(-1px) }
.signin { background:var(--blue); color:#fff; border-color:var(--blue) }
.profile { background:var(--pale); color:var(--blue2); min-width:40px }
.menu {
    display:none;
    width:40px;
    height:40px;
    border:1px solid var(--line);
    border-radius:11px;
    background:var(--surface);
    color:var(--navy);
    font-size:21px
}
.hero {
    position:relative;
    overflow:hidden;
    min-height:470px;
    padding:48px 0 55px;
    background:radial-gradient(ellipse at 75% 44%,#eaf8ff 0,transparent 42%),var(--surface)
}
.hero:before {
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    right:-230px;
    bottom:-150px;
    border:1px solid #bde6fb;
    border-radius:50%;
    box-shadow:0 0 0 22px #eaf8ff,0 0 0 44px #f5fbff
}
.hero-inner {
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:20px;
    position:relative;
    z-index:2
}
.hero-copy { position:relative; z-index:2 }
.eyebrow,.kicker {
    font-size:12px;
    line-height:1.5;
    letter-spacing:1.5px;
    font-weight:850;
    text-transform:uppercase;
    color:#18a9ed
}
.hero h1 {
    font-size:clamp(39px,4.5vw,63px);
    line-height:.99;
    letter-spacing:-2px;
    margin:14px 0 18px;
    font-weight:900
}
.hero h1 span { display:block; color:var(--blue2) }
.hero p {
    max-width:490px;
    font-size:15px;
    line-height:1.7;
    color:var(--text);
    margin:0
}
.hero p strong { color:var(--blue2) }
.hero-buttons { display:flex; gap:11px; flex-wrap:wrap; margin-top:25px }
.primary,.secondary {

    align-items:center;
    justify-content:center;
    border-radius:11px;
    padding:13px 21px;
    font-size:12px;
    font-weight:850;
    text-decoration:none
}
.primary { background:var(--blue2); color:white; border:1px solid var(--blue2) }
.secondary { background:var(--surface); color:var(--blue2); border:1px solid var(--line) }
.hero-art {
    position:relative;
    z-index:1;
    display:flex;
    justify-content:center;
    align-items:center
}
.hero-art img {
    width:min(100%,550px);
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 10px 14px #0068b40c)
}
.values { background:var(--surface2); border-block:1px solid var(--line) }
.value-grid { display:grid; grid-template-columns:repeat(4,1fr); padding:23px 0 }
.value { position:relative; text-align:center; padding:0 20px }
.value+.value:before {
    content:"";
    position:absolute;
    left:0;
    top:14px;
    bottom:7px;
    width:1px;
    background:var(--line)
}
.value-icon { width:42px; height:42px; margin:0 auto 8px; color:var(--blue2) }
.value-icon svg {
    width:100%;
    height:100%;
    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round
}
.value h3 { margin:0 0 6px; color:var(--blue2); font-size:16px }
.value p { margin:0; color:var(--text); font-size:12px; line-height:1.7 }
.page { min-height:58vh; padding:50px 0 75px }
.page-head { max-width:760px; margin:0 auto 32px; text-align:center }
.page-head h1 { font-size:clamp(32px,4.8vw,48px); letter-spacing:-1.5px; margin:9px 0 12px }
.page-head p { color:var(--muted); line-height:1.8; margin:0 }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:17px }
.card {
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    background:var(--surface);
    box-shadow:var(--shadow)
}
.card-icon {
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:var(--pale);
    color:var(--blue2);
    font-size:22px;
    margin-bottom:15px
}
.card h3 { font-size:17px; margin:0 0 8px }
.card p { font-size:13px; color:var(--muted); line-height:1.75; margin:0 }
.feature-panel {
    padding:28px;
    border-radius:20px;
    background:var(--surface2);
    border:1px solid var(--line);
    margin-top:24px
}
.feature-panel h2 { margin:0 0 10px }
.feature-panel p { color:var(--muted); line-height:1.8 }
.gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:15px }
.gallery-item {
    min-height:185px;
    border-radius:16px;

    position:relative;
    background:var(--surface2);
    border:1px solid var(--line);

    align-items:end

.gallery-item img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.gallery-item .caption {

    font-size:13px;
    font-weight:800
}
.empty-photo {

}
.leader-card {

    border-radius:18px;
    padding:20px;
    background:var(--surface);
    display:flex;
    gap:18px;
    align-items:center
}
.leader-avatar {
    width:76px;
    height:76px;
    flex:0 0 76px;
    border-radius:18px;
    background:var(--pale);
    display:grid;
    place-items:center;
    color:var(--blue2);
    font-size:28px;
    font-weight:900;
    overflow:hidden
}
.leader-avatar img { width:100%; height:100%; object-fit:cover }
.leader-card h3 { margin:0 0 5px }
.leader-card p { margin:4px 0; color:var(--muted); font-size:13px; line-height:1.6 }
.tag {

    padding:5px 9px;
    background:var(--pale);
    color:var(--blue2);
    font-size:10px;
    font-weight:850

.coming-soon {
    min-height:42vh;
    display:grid;
    place-items:center;
    text-align:center;

    background:var(--surface2);
    border-radius:22px;
    padding:35px
}
.coming-soon strong {
    display:block;
    font-size:clamp(38px,7vw,76px);
    font-weight:900;
    letter-spacing:-2px;
    color:var(--blue2)
}
.coming-soon p { color:var(--muted); max-width:460px; line-height:1.7 }
.btn {
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    border-radius:10px;
    padding:10px 14px;
    font-weight:750;
    font-size:12px
}
.btn-blue { background:var(--blue2); color:#fff; border-color:var(--blue2) }
.btn:disabled { opacity:.6; cursor:wait }
.settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px }
.setting-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    padding:15px 0;
    border-bottom:1px solid var(--line)
}
.setting-row:last-child { border-bottom:0 }
.setting-row label { font-size:13px; font-weight:750 }
.setting-row p { font-size:12px; color:var(--muted); margin:5px 0 0 }
.setting-row select { padding:9px; border:1px solid var(--line); border-radius:99px; background:var(--surface); color:var(--navy) }
.switch {
    width:44px;
    height:25px;
    border-radius:99px;
    border:0;
    background:#aab9c8;
    padding:3px
}
.switch:after {
    content:"";
    display:block;
    width:19px;
    height:19px;
    border-radius:50%;
    background:white;
    transition:transform .2s
}
.switch[aria-checked=true] { background:var(--blue) }
.switch[aria-checked=true]:after { transform:translateX(19px) }
.upload-box {
    border:1px dashed #8fc9eb;
    background:var(--surface2);
    border-radius:15px;
    padding:18px;
    margin-top:18px
}
.upload-box input { max-width:100%; font-size:12px }
.upload-box p { font-size:12px; line-height:1.7; color:var(--muted) }
.status { font-size:12px; line-height:1.6; margin-top:10px; color:var(--muted) }
.status.error { color:#c03950 }
.status.ok { color:#14804a }
.contact {
    background:#07244a;
    color:white;
    border-radius:22px;
    padding:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:22px
}
.contact p { color:#c6dff1; line-height:1.7; font-size:14px; max-width:600px }
.contact a { background:white; color:var(--blue2); white-space:nowrap }
.footer { padding:24px 0; color:var(--muted); border-top:1px solid var(--line); font-size:12px }
.footer-inner { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap }
.backdrop {
    position:fixed;
    inset:0;
    background:#051a35a8;
    z-index:80;
    display:grid;
    place-items:center;
    padding:18px
}
.modal {
    width:min(100%,430px);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:27px;
    position:relative;
    box-shadow:0 25px 80px #00172c44
}
.close {
    position:absolute;
    right:15px;
    top:15px;
    border:0;
    background:var(--surface2);
    border-radius:10px;
    width:34px;
    height:34px;
    font-size:21px;
    color:var(--navy)
}
.modal h2 { font-size:25px; margin:8px 0 }
.modal-intro { font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 18px }
.tabs { display:flex; gap:5px; background:var(--surface2); border-radius:11px; padding:4px; margin-bottom:16px }
.tabs button { flex:1; border:0; border-radius:8px; padding:10px; background:transparent; color:var(--muted); font-weight:750 }
.tabs button.active { background:var(--surface); color:var(--blue2); box-shadow:0 2px 8px #0d477014 }
.field { display:block; margin:12px 0 }
.field span { display:block; font-size:11px; font-weight:750; color:var(--muted); margin-bottom:6px }
.field input {
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:var(--surface);
    color:var(--navy)
}
.field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #0788e51c }
.submit,.google { width:100%; padding:13px; border-radius:11px; font-weight:800 }
.submit { border:0; background:var(--blue2); color:white; margin-top:6px }
.google { border:1px solid var(--line); background:var(--surface); color:var(--navy); margin-top:10px }
.message { font-size:12px; line-height:1.5; min-height:18px; color:#b52e48; margin-top:10px }
.message.success { color:#14804a }
.profile-menu {
    position:fixed;
    z-index:45;
    right:22px;
    top:76px;
    width:220px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--surface);
    box-shadow:var(--shadow)
}
.profile-email { font-size:11px; color:var(--muted); padding:9px; overflow-wrap:anywhere }
.profile-menu button {
    border:0;
    background:transparent;
    width:100%;
    text-align:left;
    padding:10px;
    border-radius:8px;
    color:var(--navy)
}
.profile-menu button:hover { background:var(--surface2) }

/* Admin styles */
.admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px }
.admin-panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px }
.admin-note { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:15px }
.admin-form label { display:block; font-size:12px; font-weight:700; margin-bottom:10px }
.admin-form input { width:100%; padding:9px; margin-top:4px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--navy) }
.admin-btn { padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:12px; font-weight:700 }
.admin-btn.primary { background:var(--blue2); color:#fff; border-color:var(--blue2) }
.admin-btn.danger { background:#c03950; color:#fff; border-color:#c03950 }
.admin-list { display:flex; flex-direction:column; gap:10px; margin-top:15px }
.admin-row { display:flex; justify-content:space-between; align-items:center; padding:10px; border:1px solid var(--line); border-radius:10px; gap:10px }
.admin-actions { display:flex; gap:6px }
.admin-status { margin-top:15px; padding:10px; border-radius:8px; font-size:12px; background:var(--surface2) }

@media(max-width:760px) {
    .navlinks { display:none; position:absolute; left:14px; right:14px; top:68px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); flex-direction:column; align-items:stretch }
    .navlinks.open { display:flex }
    .menu { display:block }
    .admin-grid { grid-template-columns:1fr }
}
</style>

function applyTheme(){document.documentElement.dataset.theme=theme;localStorage.setItem("midade-theme",theme)}
function go(page){if(!pages[page])page="home";history.pushState({page}, "", "#"+page);renderPage();window.scrollTo({top:0,behavior:"smooth"});$("navlinks").classList.remove("open");$("menuBtn").setAttribute("aria-expanded","false");$("menuBtn").textContent="☰"}
function pageHead(kicker,title,desc=""){return `<div class="page-head"><div class="kicker">${kicker}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:""}</div>`}
function iconCard(icon,title,desc){return `<article class="card"><div class="card-icon">${icon}</div><h3>${title}</h3><p>${desc}</p></article>`}

function landing(){return `<section class="hero"><div class="wrap hero-inner"><div class="hero-copy"><div class="eyebrow">${t("heroEyebrow")}</div><h1>${t("heroTitle")}<span>${t("heroSecond")}</span></h1><p>${t("heroText").replace("Mieh w Mieh.","<strong>Mieh w Mieh.</strong>")}</p><div class="hero-buttons"><a class="primary" href="#about" data-go="about">${t("learnMore")}</a><a class="secondary" href="#contact" data-go="contact">${t("contactUs")}</a></div></div><div class="hero-art"><img src="logo.png" alt="IMAC MIDADE Mieh w Mieh logo"></div></div></section>`}

const pages={
home:()=>landing(),
about:()=>`<section class="page"><div class="wrap">${pageHead("WHO WE ARE","A community with a purpose")}<div class="cards">${iconCard("♡","People first","We listen to communities.")}</div></div></section>`,
"our-work":()=>`<section class="page"><div class="wrap">${pageHead("WHAT WE DO","Our work")}</div></section>`,
"get-involved":()=>`<section class="page"><div class="wrap">${pageHead("JOIN US","Be part of the impact")}</div></section>`,
news:()=>`<section class="page"><div class="wrap">${pageHead("LATEST UPDATES","News & announcements")}<div class="coming-soon"><strong>COMING SOON</strong></div></div></section>`,
memories:()=>`<section class="page"><div class="wrap">${pageHead("OUR COMMUNITY","Memories")}<div id="memoriesGallery" class="gallery"></div><div id="memoryUploadArea"></div></div></section>`,
leaders:()=>`<section class="page"><div class="wrap">${pageHead("THE PEOPLE BEHIND OUR GROUPS","Meet our leaders")}<div class="cards" id="leadersCards">Loading leaders...</div></div></section>`,
contact:()=>`<section class="page"><div class="wrap">${pageHead("STAY CONNECTED","Contact us")}</div></section>`,
settings:()=>`<section class="page"><div class="wrap">${pageHead("YOUR EXPERIENCE","Settings")}<div class="settings-grid"><article class="card"><h3>Account</h3><p id="accountStatus">${currentUser?"Signed in as "+currentUser.email:"Guest"}</p></article></div></div></section>`,
dev:()=>`<section class="page"><div class="wrap">${pageHead("RESTRICTED AREA","Developer console")}<div id="devGate" class="feature-panel"><h2>Checking permissions…</h2></div><div id="devConsole" class="hidden"><div class="admin-grid"><article class="admin-panel"><h2>Groups</h2><form class="admin-form" id="groupCreateForm"><label>Group name<input id="newGroupName" required></label><label>Age range<input id="newGroupAge"></label><button class="admin-btn primary" type="submit">+ Add group</button></form><div id="groupAdminList" class="admin-list"></div></article><article class="admin-panel"><h2>Users & roles</h2><div id="userAdminList" class="admin-list"></div></article></div><div id="devStatus" class="admin-status">Ready.</div></div></div></section>`
};

async function refreshAccountRole(){
  currentRole="member"; currentGroup=null;
  if(!currentUser){ $("devNav").classList.add("hidden"); return; }
  
  const {data, error} = await db.from("profiles").select("role, group_id").eq("id", currentUser.id).maybeSingle();
  if(!error && data){
    currentRole = data.role || "member";
    currentGroup = data.group_id || null;
  }
  
  // Show/Hide Dev Console tab dynamically
  if(currentRole === "dev"){
    $("devNav").classList.remove("hidden");
  } else {
    $("devNav").classList.add("hidden");
  }
}

async function loadDevConsole(){
  const gate=$("devGate"), panel=$("devConsole"); if(!gate||!panel) return;
  gate.classList.remove("hidden"); panel.classList.add("hidden");
  if(!currentUser){ gate.innerHTML='<h2>Sign in required</h2><button class="btn btn-blue" data-open-auth>Sign in</button>'; return; }
  
  await refreshAccountRole();
  if(currentRole !== "dev"){
    gate.innerHTML='<h2>Access denied</h2><p>This account does not have developer privileges.</p>';
    return;
  }
  gate.classList.add("hidden"); panel.classList.remove("hidden");
  await Promise.all([loadAdminGroups(), loadAdminUsers()]);
}

async function loadAdminGroups(){
  const list=$("groupAdminList"); if(!list) return;
  const {data, error} = await db.from("groups").select("*").order("name");
  if(error){ list.innerHTML="Error loading groups."; return; }
  list.innerHTML = data.map(g=>`<div class="admin-row"><div><strong>${g.name}</strong><br><small>${g.age_range||''}</small></div></div>`).join('');
}

async function loadAdminUsers(){
  const list=$("userAdminList"); if(!list) return;
  const {data, error} = await db.from("profiles").select("*");
  if(error){ list.innerHTML="Error loading users."; return; }
  list.innerHTML = data.map(u=>`<div class="admin-row"><div><strong>${u.display_name||'User'}</strong> (${u.role})<br><small>${u.email||''}</small></div></div>`).join('');
}

function renderPage(){
  const page = location.hash.slice(1)||"home";
  const key = pages[page]?page:"home";
  $("app").innerHTML = pages[key]();
  document.querySelectorAll(".navlinks a").forEach(a=>a.classList.toggle("active",a.dataset.page===key));
  if(key==="dev") loadDevConsole();
}

function showAuth(){ $("authBackdrop").classList.remove("hidden"); }
function hideAuth(){ $("authBackdrop").classList.add("hidden"); }

$("signinTop").addEventListener("click", showAuth);
$("modalClose").addEventListener("click", hideAuth);

$("authForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=$("email").value.trim(), password=$("password").value;
  const res = authMode==="signup" 
    ? await db.auth.signUp({email, password, options:{data:{display_name:$("displayName").value}}})
    : await db.auth.signInWithPassword({email, password});
    
  if(res.error){ $("authMessage").textContent = res.error.message; }
  else { hideAuth(); await updateHeader(res.data.user); go("home"); }
});

async function updateHeader(user){
  currentUser = user;
  await refreshAccountRole();
  $("signinTop").classList.toggle("hidden", !!user);
  $("profileBtn").classList.toggle("hidden", !user);
  if(user){
    $("profileBtn").textContent = (user.email||"U")[0].toUpperCase();
    $("profileEmail").textContent = user.email;
  }
}

$("profileSignOut").addEventListener("click", async()=>{
  await db.auth.signOut();
  await updateHeader(null);
  go("home");
});

window.addEventListener("hashchange", renderPage);

(async()=>{
  applyTheme();
  $("year").textContent = new Date().getFullYear();
  const {data} = await db.auth.getSession();
  await updateHeader(data?.session?.user||null);
  renderPage();
})();
  </script>
 </body>
</html>
