</div></section><section class="page"><div class="wrap">${pageHead(t("impact"),t("impactTitle"),"From education and healthcare to food security and community development, we work hand in hand with people to create a stronger, more resilient future.")}<div class="cards">${iconCard("♧","50,000+",t("people"))}${iconCard("▤","120+",t("projects"))}${iconCard("♡","15+",t("communities"))}</div><div class="feature-panel"><h2>Explore MIDADE</h2><p>Learn about our work, meet the leaders supporting each group, and see the memories we create together.</p><button class="btn btn-blue" data-go="our-work">Discover our work →</button></div></div></section>`}
function value(key,id,path){return `<article class="value"><div class="value-icon"><svg viewBox="0 0 48 48">${path}</svg></div><h3>${t(key)}</h3><p>${t(key+"Text")}</p></article>`}
const pages={
home:()=>landing(),
about:()=>`<section class="page"><div class="wrap">${pageHead("WHO WE ARE","A community with a purpose","We believe lasting change starts with people. Through compassion, collaboration and community-led action, we work toward a brighter future for everyone.")}<div class="cards">${iconCard("♡","People first","We listen to communities and support the people who know their needs best.")}${iconCard("✦","Opportunity for all","We help create opportunities that empower individuals and strengthen communities.")}${iconCard("♧","Lasting change","We work toward practical, sustainable solutions that can benefit future generations.")}</div><div class="feature-panel"><h2>Our mission</h2><p>To support communities, empower individuals, and build a more hopeful future — together, Mieh w Mieh.</p></div></div></section>`,
"our-work":()=>`<section class="page"><div class="wrap">${pageHead("WHAT WE DO","Our work","We aim to build stronger communities through practical support, shared opportunity and sustainable initiatives.")}<div class="cards">${iconCard("▤","Education","Helping people access learning opportunities and build skills for the future.")}${iconCard("♡","Community wellbeing","Supporting initiatives that help communities thrive and care for one another.")}${iconCard("♧","Sustainability","Working toward long-term solutions shaped around local needs.")}</div></div></section>`,
"get-involved":()=>`<section class="page"><div class="wrap">${pageHead("JOIN US","Be part of the impact","Every act of support helps build a more connected and resilient community.")}<div class="cards">${iconCard("♥","Support our work","Get in touch to learn how you can support community initiatives.")}${iconCard("♧","Volunteer","Offer your time, skills and ideas to help make local projects possible.")}${iconCard("↗","Spread the word","Share our mission with your friends, family and wider community.")}</div><div class="feature-panel"><h2>Want to get involved?</h2><p>Contact the team and we will help you find a suitable way to contribute.</p><button class="btn btn-blue" data-go="contact">Contact us</button></div></div></section>`,
news:()=>`<section class="page"><div class="wrap">${pageHead("LATEST UPDATES","News & announcements","Updates from our community will be shared here.")}<div class="coming-soon"><div><strong>COMING SOON</strong><p>We're preparing news, announcements and stories from our community. Check back soon!</p></div></div></div></section>`,
memories:()=>`<section class="page"><div class="wrap">${pageHead("OUR COMMUNITY","Memories","Photos and moments shared by our groups will appear here.")}<div id="memoriesGallery" class="gallery">${Array.from({length:6},(_,i)=>`<div class="gallery-item"><div class="empty-photo">♡</div><div class="caption">Community memory ${i+1}</div></div>`).join("")}</div><div id="memoryUploadArea"></div><div id="memoryStatus" class="status"></div></div></section>`,
leaders:()=>`<section class="page"><div class="wrap">${pageHead("THE PEOPLE BEHIND OUR GROUPS","Meet our leaders","Meet the leaders who guide each group. The names and group assignments below are examples until you add your official leader profiles.")}<div class="cards">${leader("✦","Group leader","Group 1","Add the assigned leader's name and bio in your Supabase leaders table.")}${leader("✦","Group leader","Group 2","Add the assigned leader's name and bio in your Supabase leaders table.")}${leader("✦","Group leader","Group 3","Add the assigned leader's name and bio in your Supabase leaders table.")}</div><div class="feature-panel"><h2>Are you a group leader?</h2><p>Sign in with your leader account to upload photos for your assigned group. The account must be assigned a leader role in the database first.</p><button class="btn btn-blue" data-open-auth>Sign in</button></div></div></section>`,
contact:()=>`<section class="page"><div class="wrap">${pageHead("STAY CONNECTED","Contact us","Have a question or want to learn more about MIDADE Mieh w Mieh? Reach out to our team.")}<div class="contact"><div><h2>Let's make an impact together.</h2><p>Replace the placeholder email with your organisation's official contact address.</p></div><a class="pill" href="mailto:ADD_YOUR_EMAIL_HERE">EMAIL OUR TEAM ↗</a></div></div></section>`,
settings:()=>`<section class="page"><div class="wrap">${pageHead("YOUR EXPERIENCE","Settings","Choose your preferred language and appearance. These preferences are saved in this browser.")}<div class="settings-grid"><article class="card"><div class="card-icon">⚙</div><h3>Appearance & language</h3><div class="setting-row"><div><label for="languageSelect">Language</label><p>Choose the website language.</p></div><select id="languageSelect"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div><div class="setting-row"><div><label for="darkSwitch">Dark mode</label><p>Use a darker colour theme.</p></div><button id="darkSwitch" class="switch" role="switch" aria-checked="${theme==="dark"}" aria-label="Toggle dark mode"></button></div></article><article class="card"><div class="card-icon">♙</div><h3>Account</h3><p id="accountStatus">${currentUser?"Signed in as "+escapeHtml(currentUser.email||"member"):"You are browsing as a guest."}</p><div style="margin-top:15px"><button class="btn btn-blue" data-open-auth>${currentUser?"Open sign-in":"Sign in / create account"}</button></div></article></div><div class="feature-panel"><h2>Photo uploads and group permissions</h2><p>Photo uploads need a configured Supabase Storage bucket and database policies. For safety, only authenticated leaders should be allowed to upload to their own group's folder. Follow SETUP.md included in the website download.</p></div></div></section>`
};
function leader(icon,title,group,desc){return `<article class="card"><div class="leader-card" style="border:0;padding:0;box-shadow:none"><div class="leader-avatar">${icon}</div><div><span class="tag">${group}</span><h3 style="margin-top:8px">${title}</h3><p>${desc}</p></div></div></article>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadLeaders(){const container=document.querySelector("#app .cards");if(!container||location.hash!=="#leaders")return;const {data,error}=await db.from("groups").select("id,name,profiles(display_name,photo_url,bio,role)").order("name");if(error||!data?.length)return;container.innerHTML=data.map(g=>{const l=Array.isArray(g.profiles)?g.profiles.find(x=>x.role==="leader"):null;return `<article class="card"><div class="leader-card" style="border:0;padding:0;box-shadow:none"><div class="leader-avatar">${l?.photo_url?`<img src="${escapeHtml(l.photo_url)}" alt="">`:"✦"}</div><div><span class="tag">${escapeHtml(g.name)}</span><h3 style="margin-top:8px">${escapeHtml(l?.display_name||"Group leader")}</h3><p>${escapeHtml(l?.bio||"Leader profile coming soon.")}</p></div></div></article>`}).join("")}
async function loadMemories(){if(location.hash!=="#memories")return;const gallery=$("memoriesGallery");if(!gallery)return;const {data,error}=await db.from("memories").select("id,title,image_url,group_id,created_at").order("created_at",{ascending:false}).limit(30);if(error||!data?.length)return;gallery.innerHTML=data.map(m=>`<div class="gallery-item"><img src="${escapeHtml(m.image_url)}" alt="${escapeHtml(m.title||"Community memory")}" loading="lazy"><div class="caption">${escapeHtml(m.title||"Community memory")}</div></div>`).join("")}
async function loadUploadTools(){const area=$("memoryUploadArea");if(!area||!currentUser)return;const {data}=await db.from("profiles").select("role,group_id").eq("id",currentUser.id).maybeSingle();if(!data||data.role!=="leader")return;currentRole="leader";currentGroup=data.group_id;area.innerHTML=`<div class="upload-box"><h3>Upload a group memory</h3><p>Choose a JPG, PNG or WebP image (max 8 MB). The file will be stored in your group's folder.</p><label class="field"><span>Photo title</span><input id="photoTitle" maxlength="100" placeholder="Add a short title"></label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><button id="uploadPhoto" class="btn btn-blue" style="margin-top:12px">Upload photo</button><div id="uploadStatus" class="status"></div></div>`;$("uploadPhoto").addEventListener("click",uploadPhoto)}
async function uploadPhoto(){const file=$("photoFile").files[0],status=$("uploadStatus"),button=$("uploadPhoto");if(!file){status.textContent="Choose an image first.";status.className="status error";return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>8*1024*1024){status.textContent="Choose a JPG, PNG or WebP image no larger than 8 MB.";status.className="status error";return}button.disabled=true;status.textContent="Uploading…";try{const {data:profile,error:pe}=await db.from("profiles").select("role,group_id").eq("id",currentUser.id).single();if(pe)throw pe;if(profile.role!=="leader"||!profile.group_id)throw new Error("Your account must be assigned the leader role and a group by an administrator.");const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=`${profile.group_id}/${currentUser.id}/${Date.now()}-${safe}`;const {error:upErr}=await db.storage.from("group-memories").upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;const {data:pub}=db.storage.from("group-memories").getPublicUrl(path);const {error:dbErr}=await db.from("memories").insert({title:$("photoTitle").value.trim()||file.name,image_url:pub.publicUrl,group_id:profile.group_id,uploaded_by:currentUser.id,storage_path:path});if(dbErr)throw dbErr;status.textContent="Photo uploaded successfully.";status.className="status ok";await loadMemories()}catch(e){status.textContent=(e.message||"Upload failed.")+" If this mentions a policy or bucket, complete the setup steps in SETUP.md.";status.className="status error"}finally{button.disabled=false}}
function renderPage(){const page=location.hash.slice(1)||"home";const key=pages[page]?page:"home";$("app").innerHTML=pages[key]();document.querySelectorAll(".navlinks a").forEach(a=>a.classList.toggle("active",a.dataset.page===key));if(key==="settings"){const select=$("languageSelect");if(select)select.value=lang;const sw=$("darkSwitch");if(sw){sw.setAttribute("aria-checked",String(theme==="dark"));sw.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";applyTheme();sw.setAttribute("aria-checked",String(theme==="dark"))})}}if(key==="leaders")loadLeaders();if(key==="memories"){loadMemories();loadUploadTools()}}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-go]");if(nav){e.preventDefault();go(nav.dataset.go)}const auth=e.target.closest("[data-open-auth]");if(auth)showAuth()});
document.addEventListener("change",e=>{if(e.target.id==="languageSelect"){lang=e.target.value;localStorage.setItem("midade-lang",lang);applyLanguage()}});
$("menuBtn").addEventListener("click",()=>{const open=$("navlinks").classList.toggle("open");$("menuBtn").setAttribute("aria-expanded",String(open));$("menuBtn").textContent=open?"×":"☰"});
document.querySelectorAll(".navlinks a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.page)}));
window.addEventListener("popstate",renderPage);window.addEventListener("hashchange",()=>{renderPage();window.scrollTo(0,0)});
function showAuth(){ $("authBackdrop").classList.remove("hidden");$("authMessage").textContent="";$("email").focus() }function hideAuth(){$("authBackdrop").classList.add("hidden")}
$("signinTop").addEventListener("click",showAuth);$("modalClose").addEventListener("click",hideAuth);$("authBackdrop").addEventListener("click",e=>{if(e.target===$("authBackdrop"))hideAuth()});document.addEventListener("keydown",e=>{if(e.key==="Escape")hideAuth()});
function setMode(mode){authMode=mode;$("loginTab").classList.toggle("active",mode==="login");$("signupTab").classList.toggle("active",mode==="signup");$("nameField").classList.toggle("hidden",mode!=="signup");$("authTitle").textContent=mode==="login"?"Sign in":"Create your account";$("submitAuth").textContent=mode==="login"?"Sign in":"Create account";$("password").autocomplete=mode==="login"?"current-password":"new-password";$("authMessage").textContent=""}
$("loginTab").addEventListener("click",()=>setMode("login"));$("signupTab").addEventListener("click",()=>setMode("signup"));
async function updateHeader(user){currentUser=user;$("signinTop").classList.toggle("hidden",!!user);$("profileBtn").classList.toggle("hidden",!user);if(user){$("profileBtn").textContent=(user.user_metadata?.display_name||user.email||"U").trim()[0].toUpperCase();$("profileEmail").textContent=user.email||"Signed in";}else{$("profileMenu").classList.add("hidden");currentRole="member"}}
$("profileBtn").addEventListener("click",()=>$("profileMenu").classList.toggle("hidden"));$("profileSettings").addEventListener("click",()=>{ $("profileMenu").classList.add("hidden");go("settings")});document.addEventListener("click",e=>{if(!e.target.closest("#profileBtn")&&!e.target.closest("#profileMenu"))$("profileMenu").classList.add("hidden")});
$("profileSignOut").addEventListener("click",async()=>{const {error}=await db.auth.signOut();if(error){alert(error.message);return}await updateHeader(null);go("home")});
$("authForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("submitAuth");btn.disabled=true;$("authMessage").classList.remove("success");$("authMessage").textContent=authMode==="login"?"Signing in…":"Creating account…";try{let result;const email=$("email").value.trim(),password=$("password").value;if(authMode==="signup"){const displayName=$("displayName").value.trim();if(!displayName)throw new Error("Please enter your name.");result=await db.auth.signUp({email,password,options:{data:{display_name:displayName},emailRedirectTo:location.origin+location.pathname}});if(result.error)throw result.error;if(result.data.session){hideAuth();await updateHeader(result.data.user);go("home")}else{$("authMessage").classList.add("success");$("authMessage").textContent="Account created. Check your email to confirm your address, then sign in."}}else{result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;hideAuth();await updateHeader(result.data.user);go("home")}}catch(err){$("authMessage").textContent=err.message||"Unable to complete authentication."}finally{btn.disabled=false}});
$("googleBtn").addEventListener("click",async()=>{const status=$("authMessage");status.textContent="Redirecting to Google…";const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:false}});if(error)status.textContent=error.message});
// Handle OAuth callback, render the authenticated state, then remove tokens/code from the address bar.
db.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{await updateHeader(session?.user||null);if(session?.user&&["SIGNED_IN","INITIAL_SESSION","TOKEN_REFRESHED"].includes(event)){if($("authBackdrop")&&!$("authBackdrop").classList.contains("hidden"))hideAuth();if(location.hash.startsWith("#access_token")||location.search.includes("code=")){history.replaceState({},document.title,location.pathname+"#home")}renderPage()}},0)});
(async()=>{applyTheme();$("year").textContent=new Date().getFullYear();const {data,error}=await db.auth.getSession();if(error)console.warn("Session restore:",error.message);await updateHeader(data?.session?.user||null);if(location.search.includes("code=")){history.replaceState({},document.title,location.pathname+(location.hash||"#home"))}renderPage();if(location.hash.startsWith("#access_token"))history.replaceState({},document.title,location.pathname+"#home");if(location.hash.length>1)window.scrollTo(0,0)})();
</script>
</body></html>
